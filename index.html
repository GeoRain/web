<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoRain</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <main class="main-content">
    <section class="hero">
      <h1 class="hero-title">
        <span class="hero-greet">Hello, I'm</span>
        <span class="hero-name">
          <span class="name-char g">G</span><!--
       --><span class="name-char e1">e</span><!--
       --><span class="name-char o">o</span><!--
       --><span class="name-char r">R</span><!--
       --><span class="name-char a">a</span><!--
       --><span class="name-char i">i</span><!--
       --><span class="name-char n">n</span>
        </span>
      </h1>
      <p class="hero-sub">思考、构建、分享。</p>
    </section>

    <section class="contact">
      <h2 class="section-title">联系方式</h2>
      <div class="contact-grid">
        <a class="contact-item" href="javascript:void(0)" data-copy="3631486907" title="点击复制 QQ">
          <span class="contact-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </span>
          <span class="contact-label">QQ</span>
          <span class="contact-value">3631486907</span>
          <span class="contact-hint">点击复制</span>
        </a>
        <a class="contact-item" href="mailto:xinyun12345676@163.com">
          <span class="contact-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
          </span>
          <span class="contact-label">邮箱</span>
          <span class="contact-value">xinyun12345676@163.com</span>
          <span class="contact-hint">发送邮件</span>
        </a>
        <a class="contact-item" href="javascript:void(0)" data-copy="codefox_233" title="点击复制微信号">
          <span class="contact-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 00-16 0v3l-1 3h18l-1-3v-3z"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg>
          </span>
          <span class="contact-label">微信</span>
          <span class="contact-value">codefox_233</span>
          <span class="contact-hint">点击复制</span>
        </a>
        <div class="contact-item">
          <span class="contact-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <span class="contact-label">Xbox</span>
          <span class="contact-value">GeoRainP</span>
          <span class="contact-hint">添加好友</span>
        </div>
      </div>
    </section>
  </main>

  <button class="theme-fab" id="themeToggle" aria-label="切换主题">
    <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>

  <script src="script.js"></script>
  <script src="https://keepandroidopen.org/banner.js"></script>
</body>
</html>
